<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <main class="content">
        <h1>Booking form</h1>
        <p>Fields marked with an asterisk (*) are required</p>
        <form action="#" method="post">
            <fieldset>
                <legend>Contact information</legend>
                <div class="field">
                    <label for="name">Full name <span class="required">*</span></label>
                    <input type="text" id="name" name="name" placeholder="First name Surname" autocomplete="name"
                        maxlength="100" required>
                </div>
                <div class="field">
                    <label for="email">Email<span class="required">*</span></label>
                    <input type="email" id="email" name="email" placeholder="firstname.surname@mail.com"
                        autocomplete="email" maxlength="100" required>
                </div>
                <div class="field">
                    <label for="phone">Phone</label>
                    <input type="tel" id="phone" name="phone" placeholder="+35812345678" autocomplete="phone">
                </div>
            </fieldset>
            <fieldset>
                <legend>Choose the office *</legend>
                <label for="office">Choose the office: <span class="required">*</span></label>
                <select name="office" id="office">
                    <option value="#">Choose the office</option>
                    <option value="office1">Office for 5 people</option>
                    <option value="office2">Office for 10 people</option>
                    <option value="office3">Office for 15 people</option>
                </select>
                <div class="field">
                    <label for="start-date">Choose the starting date <span class="required">*</span></label>
                    <input type="date" name="start-date" id="start-date" required>
                    <span> - </span>
                    <label for="end-date">Choose the ending date <span class="required">*</span></label>
                    <input type="date" name="end-date" id="end-date" required>
                </div>
                <div class="field">
                    <label for="person">Choose how many person will attend <span class="required">*</span></label>
                    <input type="number" name="person" id="person" min="1" max="20" value="1" required>
                </div>
                <p>Extra services</p>
                <div class="choose">
                    <input type="checkbox" id="lunch" name="lunch" value="lunch">
                    <label for="lunch">Lunch (15 € per person)</label>
                </div>
                <div class="choose">
                    <input type="checkbox" id="drink" name="drink" value="drink">
                    <label for="drink">Soft drink (20 €)</span></label>
                </div>
                <div class="choose">
                    <input type="checkbox" id="earplug" name="earplug" value="earplug">
                    <label for="earplug">Ear plugs (2 €)</span></label>
                </div>
                <!-- Huom radio buttonissa, name pitää olla kaikilla sama, jotta radiobutton toimii oikein. -->
            </fieldset>
            <fieldset>
                <legend>Additional request</legend>
                <div class="field">
                    <label for="message">Write an additional request</label>
                    <textarea name="message" id="message" rows="10" placeholder="Write a message"></textarea>
                </div>

            </fieldset>
            <div class="buttons">
                <button type="submit">Submit</button>
                <button type="reset" class="reset">Reset</button>
            </div>
        </form>
    </main>
</body>

</html>
